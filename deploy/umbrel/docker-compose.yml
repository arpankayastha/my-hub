version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: myhub_web_1
      APP_PORT: 3000
      # My Hub ships its own session-based login, so Umbrel's proxy auth is
      # disabled to avoid a double sign-in (same pattern as Immich).
      # Caveat: with proxy auth off, the first-run bootstrap endpoint
      # (POST /api/v1/auth/setup) is reachable by any LAN/Tor client until the
      # owner creates the first admin. Complete setup immediately after install.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/arpankayastha/my-hub:0.66.0@sha256:0de09531d39d16e13281100b8a55dd3307f1db9a2a07ef5fbfd928894e639cbf
    restart: on-failure
    stop_grace_period: 1m
    # No `user:` override: the image entrypoint starts as root only to chown the
    # data/backup volumes, then drops to the unprivileged `node` user via gosu.
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/backups:/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Bewusst /data/my-hub.db: der oben gepinnte Image-Digest (0.66.0) enthält die
      # my-hub.db→myhub.db-Boot-Migration noch NICHT. Würde hier myhub.db stehen,
      # bootete das alte Image gegen eine leere DB und ignorierte vorhandene Daten.
      # Beim nächsten Image-Bump (auf eine migrations-fähige Version) migriert der
      # Resolver my-hub.db automatisch — dieser Pfad darf dann unverändert bleiben.
      - DB_PATH=/data/my-hub.db
      - BACKUP_DIR=/backups
      # SESSION_SECRET is required; Umbrel injects a deterministic per-app secret.
      - SESSION_SECRET=${APP_SEED}
      # Umbrel serves apps over plain HTTP on the LAN, so secure cookies stay off.
      - SESSION_SECURE=false
